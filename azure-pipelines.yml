trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '26.x'          # same major as the node:26-alpine image
  mainFile: 'server.js'        # main JS file to run
  testFile: 'server.test.js'   # Jest unit test file
  imageName: 'qodana-example-nodejs'
  imageTag: '$(Build.BuildId)'
  containerName: 'qodana-example-nodejs-smoke'

  # Tools
  nucleiVersion: '3.11.1'
  dastFailOn: 'medium,high,critical'   # Nuclei severities that fail the build
  zapImage: 'ghcr.io/zaproxy/zaproxy:2.17.0'
  zapFailOnRisk: '2'                   # ZAP risk that fails the build: 3 High, 2 Medium, 1 Low
  gitleaksImage: 'zricethezav/gitleaks:v8.30.1'
  hadolintImage: 'hadolint/hadolint:v2.15.1'
  dockleImage: 'goodwithtech/dockle:v0.4.15'
  lockfileLintVersion: '5.1.0'

  # SARIF reports of all scanners are collected into this folder and
  # published as "CodeAnalysisLogs" (read by the "SARIF SAST Scans
  # Tab" extension, which shows all findings in one tab of the run).
  sarifDir: '$(Build.ArtifactStagingDirectory)/sarif'

stages:

  # ============================================================
  # IMPLEMENT
  # ============================================================
  - stage: Implement
    displayName: 'Build'
    jobs:
      - job: Build
        displayName: 'Build Node.js application'
        steps:
          - checkout: self
            displayName: 'Checkout repository'
            clean: true

          # ====================================================
          # INSTALL NODE.JS
          # ====================================================
          - task: UseNode@1
            displayName: 'Install Node.js $(nodeVersion)'
            inputs:
              version: '$(nodeVersion)'

          - script: |
              node --version
              npm --version
            displayName: 'Show Node.js information'

          # ====================================================
          # LOCKFILE LINT (supply chain)
          # Every package in package-lock.json must come from
          # registry.npmjs.org over HTTPS, with an integrity hash
          # and a matching name (rules in .lockfile-lintrc.json).
          # Blocks a tampered lockfile that points elsewhere.
          # ====================================================
          - script: |
              npx --yes lockfile-lint@$(lockfileLintVersion)
            displayName: 'Lint package-lock.json (lockfile-lint)'

          # ====================================================
          # INSTALL DEPENDENCIES
          # --ignore-scripts (used for every npm ci in this
          # pipeline): package install scripts never run, so a
          # compromised dependency cannot execute code on the agent.
          # ====================================================
          - script: |
              npm ci --ignore-scripts
            displayName: 'Install dependencies'

          # ====================================================
          # VERIFY PACKAGE SIGNATURES (supply chain)
          # Checks that every installed package carries a valid
          # npm registry signature (and provenance attestation
          # where published), i.e. was not tampered with.
          # ====================================================
          - script: |
              npm audit signatures
            displayName: 'Verify npm package signatures'

          # ====================================================
          # ESLINT
          # ====================================================
          - script: |
              npm run lint
            displayName: 'Run ESLint'

          # ====================================================
          # VALIDATE JAVASCRIPT SYNTAX
          # ====================================================
          - script: |
              node --check "$(mainFile)"
              node --check "$(testFile)"
            displayName: 'Validate JavaScript syntax'


  # ============================================================
  # TESTING
  # ============================================================
  - stage: Testing
    displayName: 'Testing'
    dependsOn: Implement

    jobs:
      - job: Tests
        displayName: 'Run tests'
        steps:
          - checkout: self
            displayName: 'Checkout repository'
            clean: true

          - task: UseNode@1
            displayName: 'Install Node.js $(nodeVersion)'
            inputs:
              version: '$(nodeVersion)'

          - script: |
              npm ci --ignore-scripts
            displayName: 'Install dependencies'

          # ====================================================
          # UNIT TESTS + COVERAGE
          # ====================================================
          - script: |
              mkdir -p "$(Agent.TempDirectory)/TestResults"
              mkdir -p "$(Agent.TempDirectory)/Coverage"

              # Runs only the selected test file and measures coverage
              # of the selected main file (overrides package.json).
              npx jest \
                --ci \
                --coverage \
                --collectCoverageFrom="$(mainFile)" \
                --runTestsByPath "$(testFile)" \
                --reporters=default \
                --reporters=jest-junit
            displayName: 'Unit tests with coverage'
            env:
              JEST_JUNIT_OUTPUT_DIR: $(Agent.TempDirectory)/TestResults
              JEST_JUNIT_OUTPUT_NAME: test-results.xml

          # ====================================================
          # COPY COVERAGE
          # ====================================================
          - script: |
              cp coverage/cobertura-coverage.xml \
                "$(Agent.TempDirectory)/Coverage/coverage.xml"
            displayName: 'Prepare coverage report'
            condition: succeededOrFailed()

          # ====================================================
          # PUBLISH TEST RESULTS
          # ====================================================
          - task: PublishTestResults@2
            displayName: 'Publish test results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '$(Agent.TempDirectory)/TestResults/*.xml'
              failTaskOnFailedTests: true
              testRunTitle: 'Node.js unit tests'

          # ====================================================
          # PUBLISH CODE COVERAGE
          # ====================================================
          - task: PublishCodeCoverageResults@2
            displayName: 'Publish code coverage'
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(Agent.TempDirectory)/Coverage/coverage.xml'

      # ========================================================
      # MUTATION TESTING (Stryker)
      # Stryker changes server.js in small ways (flips conditions,
      # removes checks, alters regexes) and expects the tests to
      # fail for each change. The mutation score shows how many
      # real bugs the tests would catch - coverage alone cannot.
      # Fails below the "break" threshold in stryker.config.json.
      # ========================================================
      - job: MutationTests
        displayName: 'Mutation tests (Stryker)'
        steps:
          - checkout: self
            displayName: 'Checkout repository'
            clean: true

          - task: UseNode@1
            displayName: 'Install Node.js $(nodeVersion)'
            inputs:
              version: '$(nodeVersion)'

          - script: |
              npm ci --ignore-scripts
            displayName: 'Install dependencies'

          - script: |
              npx stryker run --mutate "$(mainFile)"
            displayName: 'Run Stryker mutation tests'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish mutation report'
            condition: succeededOrFailed()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/reports/mutation'
              artifact: 'mutation-report'


  # ============================================================
  # SECURITY
  # ============================================================
  - stage: Security
    displayName: 'Security'
    dependsOn: Testing

    jobs:

      # ========================================================
      # TRIVY VULNERABILITY / SCA SCAN
      # ========================================================
      - job: TrivyVulnerabilities
        displayName: 'Trivy SCA'
        steps:
          - checkout: self
            displayName: 'Checkout repository'
            clean: true

          - task: UseNode@1
            displayName: 'Install Node.js $(nodeVersion)'
            inputs:
              version: '$(nodeVersion)'

          # Install dependencies so package-lock/node_modules
          # are available for analysis.
          - script: |
              npm ci --ignore-scripts
            displayName: 'Install Node.js dependencies'

          - script: |
              sudo apt-get install -y wget gnupg

              wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
                | gpg --dearmor \
                | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

              echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
                | sudo tee /etc/apt/sources.list.d/trivy.list

              sudo apt-get update
              sudo apt-get install -y trivy

              trivy --version
            displayName: 'Install Trivy'

          - script: |
              trivy fs \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --exit-code 1 \
                "$(Build.SourcesDirectory)"
            displayName: 'Scan Node.js dependencies with Trivy'

          # Same scan as SARIF for the Scans tab (never fails).
          - script: |
              mkdir -p "$(sarifDir)"

              trivy fs \
                --scanners vuln \
                --format sarif \
                --output "$(sarifDir)/trivy-fs-vuln.sarif" \
                "$(Build.SourcesDirectory)"
            displayName: 'Trivy SCA report (SARIF)'
            condition: succeededOrFailed()

          - task: PublishPipelineArtifact@1
            displayName: 'Publish SARIF'
            condition: succeededOrFailed()
            inputs:
              targetPath: '$(sarifDir)'
              artifact: 'sarif-trivy-fs-vuln'


      # ========================================================
      # TRIVY SECRET SCAN
      # ========================================================
      - job: TrivySecrets
        displayName: 'Trivy Secrets Scanning'
        steps:
          - checkout: self
            displayName: 'Checkout repository'
            clean: true

          - script: |
              sudo apt-get install -y wget gnupg

              wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
                | gpg --dearmor \
                | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

              echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
                | sudo tee /etc/apt/sources.list.d/trivy.list

              sudo apt-get update
              sudo apt-get install -y trivy

              trivy --version
            displayName: 'Install Trivy'

          - script: |
              trivy fs \
                --scanners secret \
                --secret-config "$(Build.SourcesDirectory)/trivy-secret.yaml" \
                --exit-code 1 \
                "$(Build.SourcesDirectory)"
            displayName: 'Scan secrets with Trivy'

          - script: |
              mkdir -p "$(sarifDir)"

              trivy fs \
                --scanners secret \
                --secret-config "$(Build.SourcesDirectory)/trivy-secret.yaml" \
                --format sarif \
                --output "$(sarifDir)/trivy-fs-secret.sarif" \
                "$(Build.SourcesDirectory)"
            displayName: 'Trivy secrets report (SARIF)'
            condition: succeededOrFailed()

          - task: PublishPipelineArtifact@1
            displayName: 'Publish SARIF'
            condition: succeededOrFailed()
            inputs:
              targetPath: '$(sarifDir)'
              artifact: 'sarif-trivy-fs-secret'


      # ========================================================
      # GITLEAKS - SECRETS IN THE WHOLE GIT HISTORY
      # Trivy only sees the current files. Gitleaks scans every
      # commit, so a secret that was committed and later deleted
      # is still found. Accepted old findings are listed (with a
      # reason) in .gitleaksignore; anything new fails the build.
      # ========================================================
      - job: Gitleaks
        displayName: 'Gitleaks (git history secrets)'
        steps:
          - checkout: self
            displayName: 'Checkout repository (full history)'
            clean: true
            fetchDepth: 0        # all commits, not a shallow clone

          - script: |
              mkdir -p "$(sarifDir)"
              chmod 777 "$(sarifDir)"

              docker run --rm \
                -v "$(Build.SourcesDirectory):/repo" \
                -v "$(sarifDir):/out" \
                "$(gitleaksImage)" \
                git /repo \
                --redact \
                --verbose \
                --no-banner \
                --report-format sarif \
                --report-path /out/gitleaks.sarif
            displayName: 'Scan git history with Gitleaks'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish SARIF'
            condition: succeededOrFailed()
            inputs:
              targetPath: '$(sarifDir)'
              artifact: 'sarif-gitleaks'


      # ========================================================
      # HADOLINT - DOCKERFILE LINTER
      # Dockerfile best practices: JSON-form CMD/HEALTHCHECK,
      # numeric USER, pinned versions, apk/npm cache handling,
      # merged RUN layers, ... Any finding fails the build.
      # ========================================================
      - job: Hadolint
        displayName: 'Hadolint (Dockerfile lint)'
        steps:
          - checkout: self
            displayName: 'Checkout repository'
            clean: true

          - script: |
              docker run --rm -i "$(hadolintImage)" hadolint - < Dockerfile
            displayName: 'Lint Dockerfile with Hadolint'

          - script: |
              mkdir -p "$(sarifDir)"

              docker run --rm -i "$(hadolintImage)" hadolint --format sarif --no-fail - \
                < Dockerfile \
                > "$(sarifDir)/hadolint.sarif"
            displayName: 'Hadolint report (SARIF)'
            condition: succeededOrFailed()

          - task: PublishPipelineArtifact@1
            displayName: 'Publish SARIF'
            condition: succeededOrFailed()
            inputs:
              targetPath: '$(sarifDir)'
              artifact: 'sarif-hadolint'


      # ========================================================
      # DEPENDENCY FRESHNESS (information only, never fails)
      # ========================================================
      - job: DependencyCheck
        displayName: 'Newer dependency versions'
        steps:
          - checkout: self
            displayName: 'Checkout repository'
            clean: true

          - task: UseNode@1
            displayName: 'Install Node.js $(nodeVersion)'
            inputs:
              version: '$(nodeVersion)'

          - script: |
              npm ci --ignore-scripts
            displayName: 'Install dependencies'

          # Prints Current / Wanted / Latest for every package that
          # has a newer version on npm. npm outdated exits 1 when it
          # finds any, so "|| true" keeps the step green.
          - script: |
              npm outdated --long || true
            displayName: 'List newer dependency versions'


      # ========================================================
      # SBOM (Software Bill of Materials)
      # ========================================================
      - job: SBOM
        displayName: 'Generate SBOM'
        steps:
          - checkout: self
            displayName: 'Checkout repository'
            clean: true

          - task: UseNode@1
            displayName: 'Install Node.js $(nodeVersion)'
            inputs:
              version: '$(nodeVersion)'

          # npm sbom reads the installed tree, so install first.
          - script: |
              npm ci --ignore-scripts
            displayName: 'Install dependencies'

          # Built into npm 10.1+, nothing extra to install.
          # CycloneDX JSON, all dependencies (prod + dev).
          - script: |
              mkdir -p "$(Build.ArtifactStagingDirectory)/sbom"

              npm sbom \
                --sbom-format cyclonedx \
                --sbom-type application \
                > "$(Build.ArtifactStagingDirectory)/sbom/sbom.cdx.json"

              node -e "
                const s = require('$(Build.ArtifactStagingDirectory)/sbom/sbom.cdx.json');
                console.log('CycloneDX ' + s.specVersion + ', ' + s.components.length + ' components');
              "
            displayName: 'Generate CycloneDX SBOM'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish SBOM artifact'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/sbom'
              artifact: 'sbom'


      # ========================================================
      # QODANA SAST
      # ========================================================
      - job: Qodana
        displayName: 'Qodana SAST'
        steps:
          - checkout: self
            displayName: 'Checkout repository'
            clean: true
            persistCredentials: true

          - task: UseNode@1
            displayName: 'Install Node.js $(nodeVersion)'
            inputs:
              version: '$(nodeVersion)'

          - script: |
              npm ci --ignore-scripts
            displayName: 'Install Node.js dependencies'

#          - task: Cache@2
#            displayName: 'Cache Qodana'
#            inputs:
#              key: '"qodana" | "$(Build.Repository.Name)" | "$(Build.SourceBranchName)"'
#              path: '$(Agent.TempDirectory)/qodana/cache'
#              restoreKeys: |
#                "qodana" | "$(Build.Repository.Name)"
#                "qodana"

#          - task: QodanaScan@2026
#            displayName: 'Run Qodana'
#            inputs:
#              uploadResult: true
#            env:
#              QODANA_TOKEN: $(QODANA_TOKEN)

      # ========================================================
      # SEMGREP SAST
      # ========================================================
      - job: Semgrep
        displayName: 'Semgrep SAST'

        steps:
          - checkout: self
            displayName: 'Checkout repository'
            clean: true

          # ====================================================
          # INSTALL PYTHON
          # Semgrep CLI is distributed as a Python package.
          # This does NOT change your application from Node.js.
          # ====================================================
          - task: UsePythonVersion@0
            displayName: 'Install Python for Semgrep'
            inputs:
              versionSpec: '3.12'
              addToPath: true

          # ====================================================
          # INSTALL SEMGREP
          # ====================================================
          - script: |
              python -m pip install --upgrade pip
              pip install semgrep
              semgrep --version
            displayName: 'Install Semgrep'

          # ====================================================
          # RUN SAST
          # ====================================================
          - script: |
              mkdir -p "$(sarifDir)"

              # Readable findings in the log + SARIF for the Scans tab.
              semgrep scan \
                --config p/javascript \
                --config p/nodejs \
                --error \
                --sarif-output="$(sarifDir)/semgrep.sarif" \
                .
            displayName: 'Run Semgrep SAST'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish SARIF'
            condition: succeededOrFailed()
            inputs:
              targetPath: '$(sarifDir)'
              artifact: 'sarif-semgrep'


  # ============================================================
  # CONTAINER SECURITY
  # Builds the Docker image once, then three jobs run in parallel
  # on exactly that image:
  #   - TrivyContainer: Dockerfile config, image SCA, secrets,
  #                     Dockle (CIS), container SBOM + licenses
  #   - SmokeAndDAST:   starts a locked-down container, smoke-tests
  #                     the API, runs Nuclei DAST against it
  #   - ZapDAST:        OWASP ZAP API scan driven by openapi.yaml
  # ============================================================
  - stage: ContainerSecurity
    displayName: 'Container Security'
    dependsOn: Security

    jobs:

      # ========================================================
      # BUILD CONTAINER
      # ========================================================
      - job: BuildContainer
        displayName: 'Build Docker image'
        steps:
          - checkout: self
            displayName: 'Checkout repository'
            clean: true

          # ====================================================
          # BUILD IMAGE
          # The Dockerfile runs lint + unit tests in its build
          # stage, so a broken build or failing test stops here.
          # ====================================================
          - script: |
              DOCKER_BUILDKIT=1 docker build \
                --pull \
                --build-arg MAIN_FILE="$(mainFile)" \
                --build-arg TEST_FILE="$(testFile)" \
                -t "$(imageName):$(imageTag)" \
                .

              docker image ls "$(imageName)"
            displayName: 'Build Docker image'

          # ====================================================
          # INSTALL TRIVY
          # Save the image so the parallel jobs below use exactly
          # the same image (each job runs on a fresh agent).
          # ====================================================
          - script: |
              mkdir -p "$(Build.ArtifactStagingDirectory)/docker"

              docker save \
                "$(imageName):$(imageTag)" \
                -o "$(Build.ArtifactStagingDirectory)/docker/$(imageName).tar"
            displayName: 'Save Docker image'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Docker image artifact'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/docker'
              artifact: 'docker-image'


      # ========================================================
      # TRIVY: DOCKERFILE + IMAGE SCA + SECRETS + SBOM
      # ========================================================
      - job: TrivyContainer
        displayName: 'Trivy Container SCA + SBOM'
        dependsOn: BuildContainer
        steps:
          - checkout: self
            displayName: 'Checkout repository'
            clean: true

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Docker image'
            inputs:
              artifact: 'docker-image'
              path: '$(Pipeline.Workspace)/docker'

          - script: |
              docker load -i "$(Pipeline.Workspace)/docker/$(imageName).tar"
            displayName: 'Load Docker image'

          - script: |
              sudo apt-get install -y wget gnupg

              wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
                | gpg --dearmor \
                | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

              echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
                | sudo tee /etc/apt/sources.list.d/trivy.list

              sudo apt-get update
              sudo apt-get install -y trivy

              trivy --version
            displayName: 'Install Trivy'

          # ====================================================
          # SAST FOR CONTAINERS: DOCKERFILE MISCONFIGURATION
          # Static analysis of the Dockerfile (running as root,
          # missing USER, unpinned images, secrets in ENV, ...).
          # ====================================================
          - script: |
              trivy config \
                --severity HIGH,CRITICAL \
                --exit-code 1 \
                Dockerfile
            displayName: 'Scan Dockerfile (misconfiguration)'

          # ====================================================
          # SCA: VULNERABILITIES IN THE IMAGE
          # OS packages (Alpine) + Node.js packages inside the
          # final image. --ignore-unfixed skips CVEs that have no
          # fix available yet, so the build only fails on what
          # can actually be acted on.
          # ====================================================
          - script: |
              trivy image \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --ignore-unfixed \
                --exit-code 1 \
                "$(imageName):$(imageTag)"
            displayName: 'Scan image vulnerabilities (SCA)'
            condition: succeededOrFailed()

          # ====================================================
          # SECRETS BAKED INTO IMAGE LAYERS
          # ====================================================
          - script: |
              trivy image \
                --scanners secret \
                --exit-code 1 \
                "$(imageName):$(imageTag)"
            displayName: 'Scan image for secrets'
            condition: succeededOrFailed()

          # ====================================================
          # DOCKLE - CIS DOCKER BENCHMARK ON THE BUILT IMAGE
          # Checks the image itself (not the Dockerfile): runs as
          # root, setuid/setgid files, credentials left in files
          # or ENV, missing HEALTHCHECK, ... WARN and FATAL fail.
          # ====================================================
          - script: |
              docker run --rm \
                -v /var/run/docker.sock:/var/run/docker.sock \
                "$(dockleImage)" \
                --exit-code 1 \
                --exit-level warn \
                "$(imageName):$(imageTag)"
            displayName: 'Check image with Dockle (CIS benchmark)'
            condition: succeededOrFailed()

          # Image vulnerabilities + secrets as SARIF (never fails).
          - script: |
              mkdir -p "$(sarifDir)"

              trivy image \
                --scanners vuln,secret \
                --format sarif \
                --output "$(sarifDir)/trivy-image.sarif" \
                "$(imageName):$(imageTag)"
            displayName: 'Trivy image report (SARIF)'
            condition: succeededOrFailed()

          - task: PublishPipelineArtifact@1
            displayName: 'Publish SARIF'
            condition: succeededOrFailed()
            inputs:
              targetPath: '$(sarifDir)'
              artifact: 'sarif-trivy-image'

          # ====================================================
          # CONTAINER SBOM
          # Unlike "npm sbom" (npm packages from the source), this
          # covers everything in the final image: Alpine OS
          # packages, the Node.js runtime and the production
          # node_modules.
          # ====================================================
          - script: |
              mkdir -p "$(Build.ArtifactStagingDirectory)/sbom"

              trivy image \
                --format cyclonedx \
                --output "$(Build.ArtifactStagingDirectory)/sbom/$(imageName).cdx.json" \
                "$(imageName):$(imageTag)"
            displayName: 'Generate container SBOM'
            condition: succeededOrFailed()

          # ====================================================
          # LICENSE REPORTS (information only, never fail)
          # ====================================================
          - script: |
              trivy sbom \
                --scanners license \
                --pkg-types library \
                --severity UNKNOWN,HIGH,CRITICAL \
                "$(Build.ArtifactStagingDirectory)/sbom/$(imageName).cdx.json"
            displayName: 'SBOM - Application (npm) license report'
            condition: succeededOrFailed()

          - script: |
              trivy sbom \
                --scanners license \
                --pkg-types os \
                --severity UNKNOWN,HIGH,CRITICAL \
                "$(Build.ArtifactStagingDirectory)/sbom/$(imageName).cdx.json"
            displayName: 'SBOM - Container OS license report'
            condition: succeededOrFailed()

          - task: PublishPipelineArtifact@1
            displayName: 'Publish container SBOM'
            condition: succeededOrFailed()
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/sbom'
              artifact: 'container-sbom'


      # ========================================================
      # SMOKE TESTS + NUCLEI DAST ON THE RUNNING CONTAINER
      # ========================================================
      - job: SmokeAndDAST
        displayName: 'Smoke tests + Nuclei DAST'
        dependsOn: BuildContainer
        steps:
          - checkout: none

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Docker image'
            inputs:
              artifact: 'docker-image'
              path: '$(Pipeline.Workspace)/docker'

          - script: |
              docker load -i "$(Pipeline.Workspace)/docker/$(imageName).tar"
            displayName: 'Load Docker image'

          # ====================================================
          # START CONTAINER (LOCKED DOWN)
          # A throwaway RSA key is generated for this run only,
          # so /api/token works without any stored secret.
          # The container runs the way production should run it,
          # which proves the app works with minimal rights:
          #   --read-only          root filesystem cannot be changed
          #   --tmpfs /tmp         the only writable place, in memory
          #   --cap-drop ALL       no Linux capabilities at all
          #   no-new-privileges    setuid binaries cannot gain rights
          #   --pids-limit/memory  a runaway process cannot take the host
          # ====================================================
          - script: |
              set -e

              openssl genpkey \
                -algorithm RSA \
                -pkeyopt rsa_keygen_bits:2048 \
                -out "$(Agent.TempDirectory)/signing-key.pem" 2>/dev/null

              docker run --detach \
                --name "$(containerName)" \
                --publish 8080:8080 \
                --read-only \
                --tmpfs /tmp:rw,noexec,nosuid,size=16m \
                --cap-drop ALL \
                --security-opt no-new-privileges \
                --pids-limit 100 \
                --memory 256m \
                --env TOKEN_SIGNING_KEY="$(cat "$(Agent.TempDirectory)/signing-key.pem")" \
                "$(imageName):$(imageTag)"

              rm -f "$(Agent.TempDirectory)/signing-key.pem"
            displayName: 'Start container'

          # ====================================================
          # WAIT FOR THE DOCKERFILE HEALTHCHECK
          # ====================================================
          - script: |
              echo "Waiting for container..."

              for i in $(seq 1 30); do
                STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$(containerName)" 2>/dev/null)
                RUNNING=$(docker inspect --format='{{.State.Running}}' "$(containerName)" 2>/dev/null)

                echo "Attempt $i - running: $RUNNING, health: $STATUS"

                if [ "$STATUS" = "healthy" ]; then
                  echo "Container is healthy."
                  exit 0
                fi

                if [ "$RUNNING" != "true" ] || [ "$STATUS" = "unhealthy" ]; then
                  echo "Container crashed or is unhealthy."
                  docker logs "$(containerName)"
                  exit 1
                fi

                sleep 2
              done

              echo "Container did not become healthy in time."
              docker logs "$(containerName)"
              exit 1
            displayName: 'Verify Docker health check'

          # ====================================================
          # SMOKE TESTS
          # Real HTTP calls against the real image: catches what
          # unit tests cannot, e.g. a dependency pruned from the
          # runtime image ("Cannot find module").
          # ====================================================
          - script: |
              BASE="http://localhost:8080"
              FAILED=0

              check() {
                # check <name> <path> <expected status> [expected body text]
                BODY=$(curl --silent --show-error --max-time 5 \
                  --output - --write-out '\n%{http_code}' "$BASE$2")
                CODE=$(echo "$BODY" | tail -n 1)
                TEXT=$(echo "$BODY" | sed '$d')

                if [ "$CODE" != "$3" ]; then
                  echo "FAIL  $1: expected HTTP $3, got $CODE"
                  FAILED=1
                elif [ -n "$4" ] && ! echo "$TEXT" | grep -q "$4"; then
                  echo "FAIL  $1: response does not contain '$4'"
                  FAILED=1
                else
                  echo "PASS  $1 (HTTP $CODE)"
                fi
              }

              check 'current time'     '/api/current_time'          200 'currentTime'
              check 'greeting'         '/api/greeting?name=Alice'   200 'Hello, Alice!'
              check 'token'            '/api/token?user=alice'      200 'token'
              check 'unknown endpoint' '/api/does-not-exist'        404 'Not found'
              check 'ping (no caps)'   '/api/ping?host=127.0.0.1'   200 '1 packets received'

              # Node permission model (see Dockerfile CMD): reading
              # outside /app must be refused even via path traversal.
              if curl --silent --max-time 5 "$BASE/api/file?name=../../etc/passwd" | grep -q 'root:'; then
                echo "FAIL  permission model: /etc/passwd is readable"
                FAILED=1
              else
                echo "PASS  permission model blocks /etc/passwd"
              fi

              if [ "$FAILED" -ne 0 ]; then
                echo "========== CONTAINER LOG =========="
                docker logs "$(containerName)"
                exit 1
              fi
            displayName: 'Smoke tests'

          # ====================================================
          # INSTALL NUCLEI
          # ====================================================
          - script: |
              set -e

              echo "Downloading Nuclei $(nucleiVersion)..."

              curl -fsSL \
                --retry 3 \
                --connect-timeout 15 \
                --max-time 120 \
                -o /tmp/nuclei.zip \
                "https://github.com/projectdiscovery/nuclei/releases/download/v$(nucleiVersion)/nuclei_$(nucleiVersion)_linux_amd64.zip"

              unzip -o /tmp/nuclei.zip nuclei -d /tmp
              sudo install /tmp/nuclei /usr/local/bin/nuclei

              nuclei -version
              nuclei -update-templates
            displayName: 'Install Nuclei'
            timeoutInMinutes: 5

          # ====================================================
          # DAST SECURITY SCAN
          # Nuclei's default CVE / misconfig templates look for
          # known products and find almost nothing on a plain
          # Node.js http server. -dast instead fuzzes the query
          # parameters of the URLs below (path traversal, command
          # injection, open redirect, template injection, ...).
          # Every finding is printed; severities listed in
          # $(dastFailOn) fail the job. The job also fails if the
          # scan crashed the container (a malformed request
          # killing the server is a DoS finding, and Nuclei would
          # otherwise just report the target as "unresponsive").
          # ====================================================
          - script: |
              BASE="http://localhost:8080"

              cat > "$(Agent.TempDirectory)/dast-urls.txt" <<EOF
              $BASE/api/file?name=test.txt
              $BASE/api/ping?host=localhost
              $BASE/api/redirect?url=/api/current_time
              $BASE/api/greeting?name=Alice
              $BASE/api/token?user=alice
              EOF

              mkdir -p "$(sarifDir)"

              nuclei \
                -list "$(Agent.TempDirectory)/dast-urls.txt" \
                -dast \
                -timeout 6 \
                -retries 1 \
                -no-color \
                -jsonl-export "$(Agent.TempDirectory)/nuclei-findings.jsonl" \
                -sarif-export "$(sarifDir)/nuclei.sarif"

              FINDINGS="$(Agent.TempDirectory)/nuclei-findings.jsonl"
              touch "$FINDINGS"

              # Nuclei writes no SARIF when nothing is found; an empty
              # file keeps the publish step working (the Reports stage
              # skips empty files).
              touch "$(sarifDir)/nuclei.sarif"

              FAILED=0

              BLOCKING=$(jq -s --arg sev "$(dastFailOn)" \
                '($sev | split(",")) as $s | [.[] | select(.info.severity as $x | $s | index($x))] | length' \
                "$FINDINGS")
              echo "Findings: $(wc -l < "$FINDINGS") total, $BLOCKING with severity in [$(dastFailOn)]."

              if [ "$BLOCKING" -gt 0 ]; then
                echo "##vso[task.logissue type=error]Nuclei found $BLOCKING issue(s) with severity in [$(dastFailOn)]."
                FAILED=1
              fi

              if [ "$(docker inspect --format='{{.State.Running}}' "$(containerName)")" != "true" ]; then
                echo "##vso[task.logissue type=error]The container crashed during the DAST scan (denial of service)."
                echo "========== CONTAINER LOG =========="
                docker logs --tail 30 "$(containerName)"
                FAILED=1
              fi

              exit $FAILED
            displayName: 'Nuclei DAST scan'
            timeoutInMinutes: 10

          - task: PublishPipelineArtifact@1
            displayName: 'Publish SARIF'
            condition: succeededOrFailed()
            inputs:
              targetPath: '$(sarifDir)'
              artifact: 'sarif-nuclei'

          # Always clean up
          - script: |
              docker rm --force "$(containerName)" || true
            displayName: 'Stop container'
            condition: always()


      # ========================================================
      # OWASP ZAP API SCAN
      # A second DAST scanner with different checks than Nuclei:
      # path traversal, SQL / OS command / template injection,
      # missing security headers, error disclosure, ... It reads
      # openapi.yaml, so it knows every endpoint and parameter.
      # Alerts with risk >= $(zapFailOnRisk) fail the job; all
      # alerts are in the HTML / JSON report artifact.
      # ========================================================
      - job: ZapDAST
        displayName: 'OWASP ZAP API scan'
        dependsOn: BuildContainer
        steps:
          - checkout: self
            displayName: 'Checkout repository'
            clean: true

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Docker image'
            inputs:
              artifact: 'docker-image'
              path: '$(Pipeline.Workspace)/docker'

          - script: |
              docker load -i "$(Pipeline.Workspace)/docker/$(imageName).tar"
            displayName: 'Load Docker image'

          - script: |
              set -e

              openssl genpkey \
                -algorithm RSA \
                -pkeyopt rsa_keygen_bits:2048 \
                -out "$(Agent.TempDirectory)/signing-key.pem" 2>/dev/null

              docker run --detach \
                --name "$(containerName)-zap" \
                --publish 8080:8080 \
                --read-only \
                --tmpfs /tmp:rw,noexec,nosuid,size=16m \
                --cap-drop ALL \
                --security-opt no-new-privileges \
                --env TOKEN_SIGNING_KEY="$(cat "$(Agent.TempDirectory)/signing-key.pem")" \
                "$(imageName):$(imageTag)"

              rm -f "$(Agent.TempDirectory)/signing-key.pem"

              for i in $(seq 1 30); do
                if [ "$(docker inspect --format='{{.State.Health.Status}}' "$(containerName)-zap")" = "healthy" ]; then
                  echo "Container is healthy."
                  exit 0
                fi
                sleep 2
              done

              echo "Container did not become healthy in time."
              docker logs "$(containerName)-zap"
              exit 1
            displayName: 'Start container'

          # ZAP runs as its own user inside its container, so the
          # report folder must be writable for it.
          - script: |
              ZAP_DIR="$(Agent.TempDirectory)/zap"
              mkdir -p "$ZAP_DIR"
              chmod 777 "$ZAP_DIR"
              cp openapi.yaml "$ZAP_DIR/"

              # -I: warnings do not set the exit code; the risk
              # threshold below decides instead.
              docker run --rm \
                --network host \
                -v "$ZAP_DIR:/zap/wrk:rw" \
                "$(zapImage)" \
                zap-api-scan.py \
                  -t openapi.yaml \
                  -f openapi \
                  -O http://localhost:8080 \
                  -r zap-report.html \
                  -J zap-report.json \
                  -I
              ZAP_EXIT=$?

              if [ ! -f "$ZAP_DIR/zap-report.json" ]; then
                echo "##vso[task.logissue type=error]ZAP did not produce a report (exit code $ZAP_EXIT)."
                exit 1
              fi

              FAILED=0

              BLOCKING=$(jq --arg min "$(zapFailOnRisk)" \
                '[.site[].alerts[] | select((.riskcode | tonumber) >= ($min | tonumber))] | length' \
                "$ZAP_DIR/zap-report.json")
              echo "ZAP alerts with risk >= $(zapFailOnRisk): $BLOCKING"

              if [ "$BLOCKING" -gt 0 ]; then
                jq -r --arg min "$(zapFailOnRisk)" \
                  '.site[].alerts[] | select((.riskcode | tonumber) >= ($min | tonumber)) | "  \(.riskdesc): \(.alert) (\(.count)x)"' \
                  "$ZAP_DIR/zap-report.json"
                echo "##vso[task.logissue type=error]ZAP found $BLOCKING alert(s) with risk >= $(zapFailOnRisk)."
                FAILED=1
              fi

              if [ "$(docker inspect --format='{{.State.Running}}' "$(containerName)-zap")" != "true" ]; then
                echo "##vso[task.logissue type=error]The container crashed during the ZAP scan (denial of service)."
                docker logs --tail 30 "$(containerName)-zap"
                FAILED=1
              fi

              exit $FAILED
            displayName: 'OWASP ZAP API scan'
            timeoutInMinutes: 15

          - task: PublishPipelineArtifact@1
            displayName: 'Publish ZAP report'
            condition: succeededOrFailed()
            inputs:
              targetPath: '$(Agent.TempDirectory)/zap'
              artifact: 'zap-report'

          - script: |
              docker rm --force "$(containerName)-zap" || true
            displayName: 'Stop container'
            condition: always()


  # ============================================================
  # REPORTS
  # Collects the SARIF files of every scanner (Trivy, Gitleaks,
  # Hadolint, Semgrep, Nuclei) into one "CodeAnalysisLogs"
  # artifact. With the free "SARIF SAST Scans Tab" extension
  # (Microsoft DevLabs) installed in the Azure DevOps
  # organisation, all findings show in a "Scans" tab of the run.
  # Runs even when earlier stages failed - that is when the
  # findings matter most.
  # ============================================================
  - stage: Reports
    displayName: 'Security reports'
    dependsOn:
      - Security
      - ContainerSecurity
    condition: always()

    jobs:
      - job: CollectSarif
        displayName: 'Collect SARIF reports'
        steps:
          - checkout: none

          # Downloads every artifact named sarif-* (each into its
          # own folder); missing ones (skipped jobs) are fine.
          - task: DownloadPipelineArtifact@2
            displayName: 'Download SARIF artifacts'
            inputs:
              buildType: current
              itemPattern: 'sarif-*/**'
              path: '$(Pipeline.Workspace)/sarif-in'

          - script: |
              mkdir -p "$(Build.ArtifactStagingDirectory)/CodeAnalysisLogs"

              find "$(Pipeline.Workspace)/sarif-in" -name '*.sarif' -size +0 \
                -exec cp {} "$(Build.ArtifactStagingDirectory)/CodeAnalysisLogs/" \;

              ls -la "$(Build.ArtifactStagingDirectory)/CodeAnalysisLogs"
            displayName: 'Merge SARIF files'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish CodeAnalysisLogs'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/CodeAnalysisLogs'
              artifact: 'CodeAnalysisLogs'
