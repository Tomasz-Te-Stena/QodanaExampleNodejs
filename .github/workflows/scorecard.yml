# ============================================================
# OPENSSF SCORECARD - REPOSITORY SECURITY PRACTICES
# Rates this repository (0-10 per check) on supply-chain
# security: branch protection, code review, pinned actions and
# Docker images, token permissions, dangerous workflows, signed
# releases, dependency update tool, SAST, ...
#
# Results appear in the Security tab > Code scanning (SARIF
# upload, free for public repositories) and, because
# publish_results is on, at
# https://scorecard.dev/viewer/?uri=github.com/<owner>/<repo>
#
# Information only: it never blocks anything.
# ============================================================
name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'      # Mondays 07:00 UTC
  branch_protection_rule:     # re-score when branch protection changes
  workflow_dispatch:

# Nothing by default; the job asks only for what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # upload SARIF to code scanning
      id-token: write         # sign and publish results to scorecard.dev

    steps:
      # Actions are pinned to a full commit SHA (a re-tagged
      # release cannot change what runs). Comments show the version.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
